# PostgreSQL для разработки.
# Запуск:    docker compose -f deploy/docker-compose.dev.yml up -d --wait
# Остановка: docker compose -f deploy/docker-compose.dev.yml down   (данные остаются в томе)
#
# Порт 5434 (а не 5432) — чтобы не мешать локально установленному PostgreSQL.
# Пароль несекретный и только для разработки: порт открыт лишь на 127.0.0.1.
name: milionchik-dev

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: milionchik
      POSTGRES_PASSWORD: milionchik
      POSTGRES_DB: milionchik
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      # С PostgreSQL 18 том монтируется в /var/lib/postgresql (не …/data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milionchik -d milionchik"]
      interval: 2s
      timeout: 3s
      retries: 30

  server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://milionchik:milionchik@db:5432/milionchik?sslmode=disable
      JWT_SECRET: ${JWT_SECRET:-dev-only-jwt-secret-not-for-production}
      INVITE_CODE_SECRET: ${INVITE_CODE_SECRET:-dev-only-invite-code-secret-not-for-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PRIVACY_CONTACT: ${PRIVACY_CONTACT:-}
      PRIVACY_OPERATOR: ${PRIVACY_OPERATOR:-}
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  pgdata:
