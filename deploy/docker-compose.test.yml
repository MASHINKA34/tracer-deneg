# Отдельный PostgreSQL для автотестов сервера (tool/check.ps1 поднимает и убирает его сам).
# Вручную: docker compose -f deploy/docker-compose.test.yml up -d --wait
#          docker compose -f deploy/docker-compose.test.yml down -v
#
# Без тома: данные в памяти (tmpfs) и пропадают при остановке.
name: milionchik-test

services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: milionchik
      POSTGRES_PASSWORD: milionchik
      POSTGRES_DB: milionchik_test
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U milionchik -d milionchik_test"]
      interval: 1s
      timeout: 3s
      retries: 60
