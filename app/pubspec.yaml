name: milionchik
description: "Милиончик — трекер личных трат."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  flutter_timezone: ^5.1.1
  go_router: ^18.1.0
  home_widget: ^0.10.0
  intl: ^0.20.3
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  shared:
    path: ../shared
  timezone: ^0.11.2
  web_socket_channel: ^3.0.3
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  # Шрифты лежат в приложении (офлайн), лицензии — рядом: assets/fonts/*/OFL.txt.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/unbounded/Unbounded-SemiBold.ttf
          weight: 600
