name: milionchik
description: "Милиончик — трекер личных трат."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  ffi: ^2.2.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_svg: ^2.3.0
  go_router: ^18.1.0
  intl: ^0.20.3
  logging: ^1.3.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/

  # Шрифты лежат в приложении (офлайн), лицензии — рядом: assets/fonts/*/OFL.txt.
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/manrope/Manrope-Medium.ttf
          weight: 500
        - asset: assets/fonts/manrope/Manrope-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/manrope/Manrope-Bold.ttf
          weight: 700
        - asset: assets/fonts/manrope/Manrope-ExtraBold.ttf
          weight: 800
    - family: Unbounded
      fonts:
        - asset: assets/fonts/unbounded/Unbounded-SemiBold.ttf
          weight: 600
